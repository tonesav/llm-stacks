version: "3.9"

services:
  llm-ui:
    image: nginx:latest
    container_name: llm-ui
    volumes:
      - ./app:/usr/share/nginx/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm-ui.rule=Host(`ui.localhost`)"
      - "traefik.http.services.llm-ui.loadbalancer.server.port=80"
    networks:
      - llm_net

networks:
  llm_net:
    external: true
