version: "3.9"

services:
  llm-ui:
    image: nginx:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    container_name: llm-ui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm-ui.rule=Host(`ui.localhost`)"
      - "traefik.http.services.llm-ui.loadbalancer.server.port=80"
    networks:
      - llm_net

networks:
  llm_net:
    external: true
