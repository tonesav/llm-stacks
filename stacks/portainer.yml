version: "3.9"

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/z/Docker/portainer/data:/data
    networks:
      - llm_net

networks:
  llm_net:
    external: true
