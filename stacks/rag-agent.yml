version: "3.9"

services:
  rag-agent:
    image: python:3.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    container_name: rag-agent
    working_dir: /app
    restart: unless-stopped
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "your_master_key_here"

    command: >
      sh -c "
      pip install crewai crewai-tools langchain-community requests &&
      python rag_agent.py
      "

    networks:
      - llm_net

networks:
  llm_net:
    external: true
