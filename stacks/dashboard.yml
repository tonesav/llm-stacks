version: "3.9"

services:
  dashboard:
    image: nginx:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    container_name: llm-dashboard
     ports:
      - "8088:80"
    restart: unless-stopped
    networks:
      - llm_net

networks:
  llm_net:
    external: true
